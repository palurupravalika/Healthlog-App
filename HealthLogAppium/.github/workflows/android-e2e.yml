name: HealthLog Mobile Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android Debug APK
        run: |
          cd "healthLog App"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install Appium & Dependencies
        run: |
          cd "healthLog App/HealthLogAppium"
          npm ci || npm install

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Run Appium E2E Tests on Android Emulator (API 29 Nexus 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            cd "healthLog App/HealthLogAppium"
            export APK_PATH="../app/build/outputs/apk/debug/app-debug.apk"
            bash scripts/ci_run_tests.sh

      - name: Generate Fallback Reports on Failure
        if: always()
        run: |
          cd "healthLog App/HealthLogAppium"
          node utils/generateFallbackReport.js || true

      - name: Upload Test Execution Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthlog-appium-test-results
          path: healthLog App/HealthLogAppium/test-results/

      - name: Deploy HTML Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: healthLog App/HealthLogAppium/test-results/html
          destination_dir: reports/latest

      - name: Deploy Build History Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: healthLog App/HealthLogAppium/test-results/html
          destination_dir: reports/history/build-${{ github.run_number }}
          keep_files: true
