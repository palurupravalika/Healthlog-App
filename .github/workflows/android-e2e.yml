name: HealthLog Android E2E Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-test:
    name: HealthLog Android E2E Appium Test Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Windows Environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -Force Bypass
          echo "C:\Windows\System32" >> $env:GITHUB_PATH
          echo "C:\Windows" >> $env:GITHUB_PATH

      - name: Install Dependencies
        working-directory: ./HealthLog-Appium
        run: npm install

      - name: Execute HealthLog E2E Test Runner (500 Tests)
        working-directory: ./HealthLog-Appium
        run: node runner.js

      - name: Upload E2E Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthLog-E2E-Reports
          path: |
            HealthLog-Appium/reports/execution-report.html
            HealthLog-Appium/reports/report.xlsx
            HealthLog-Appium/reports/summary.json
            HealthLog-Appium/reports/results.json
            HealthLog-Appium/reports/metrics.json
            HealthLog-Appium/reports/logs/
            HealthLog-Appium/reports/screenshots/
          if-no-files-found: warn
