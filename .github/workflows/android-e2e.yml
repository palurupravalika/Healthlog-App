# =============================================================================
# .github/workflows/android-e2e.yml
# Repository: palurupravalika/Healthlog-App
#
# PURPOSE: Lightweight entry-point for the Healthlog-App repository.
# Delegates ALL testing logic to:
#   HealthLogAppium/scripts/ci_run_tests.ps1
# =============================================================================
name: HealthLog Mobile Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e-tests:
    # ── Windows Self-Hosted Runner: HealthLogRunner ──────────────────────────
    runs-on: [self-hosted, Windows, X64, android]

    defaults:
      run:
        shell: powershell

    steps:
      # ── 1. Checkout the healthLog App repository ───────────────────────────
      - name: Checkout App Repository
        uses: actions/checkout@v4

      # ── 2. Build the Android Debug APK ─────────────────────────────────────
      - name: Build Android Debug APK
        run: |
          Write-Host "=== Building HealthLog Android APK ==="
          .\gradlew.bat assembleDebug --no-daemon

      # ── 3. Delegate ALL testing logic to the HealthLogAppium pipeline ─────
      - name: Run HealthLogAppium E2E Pipeline
        working-directory: "HealthLogAppium"
        run: |
          Write-Host "=== Delegating to HealthLogAppium test pipeline ==="
          powershell -File scripts\ci_run_tests.ps1

      # ── 4. Upload every generated artifact ────────────────────────────────
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthlog-appium-test-results-${{ github.run_number }}
          path: "HealthLogAppium/test-results/"
          retention-days: 30

      # ── 5a. Deploy latest HTML report to GitHub Pages ─────────────────────
      - name: Deploy HTML Report to GitHub Pages (latest)
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "HealthLogAppium/test-results/html"
          destination_dir: reports/latest

      # ── 5b. Persist per-build report history ──────────────────────────────
      - name: Deploy Report History to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "HealthLogAppium/test-results/html"
          destination_dir: reports/history/build-${{ github.run_number }}
          keep_files: true
